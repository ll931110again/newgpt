run_name: sft_1-3b

base_model:
  model_name_or_path: null   # set to your pretrained checkpoint/export
  tokenizer_name_or_path: meta-llama/Llama-2-7b-hf

data:
  # Expected format: jsonl with {messages:[{role,content}...]} or {prompt,response}
  train_path: data/sft/train.jsonl
  eval_path: data/sft/eval.jsonl
  seq_len: 2048

train:
  num_train_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true

peft:
  enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

logging:
  log_every_steps: 10
  save_every_steps: 250
  wandb_project: pretrainer

