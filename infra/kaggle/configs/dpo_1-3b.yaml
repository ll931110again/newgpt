run_name: dpo_1-3b

base_model:
  model_name_or_path: null   # set to SFT output
  tokenizer_name_or_path: meta-llama/Llama-2-7b-hf

data:
  # Expected jsonl: {prompt, chosen, rejected} or {messages, chosen, rejected}
  train_path: data/dpo/train.jsonl
  eval_path: data/dpo/eval.jsonl
  seq_len: 2048

train:
  num_train_epochs: 1
  learning_rate: 5.0e-6
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true

dpo:
  beta: 0.1

peft:
  enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

logging:
  log_every_steps: 10
  save_every_steps: 250
  wandb_project: pretrainer

