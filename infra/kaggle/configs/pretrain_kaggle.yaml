run_name: pretrain_kaggle

model:
  tokenizer_name_or_path: gpt2
  config_name_or_path: gpt2
  init_from: null

data:
  # Populated at runtime after download + tokenize (see pretrain_kernel.py).
  dataset_manifest: data/manifests/kaggle_v1.json
  format: packed_npy
  seq_len: 1024

train:
  # num_train_steps set at runtime from corpus size + KAGGLE_TRAIN_HOURS budget.
  num_train_steps: 500
  learning_rate: 3.0e-4
  warmup_steps: 25
  weight_decay: 0.1
  lr_scheduler_type: cosine
  grad_clip: 1.0
  per_device_train_batch_size: 4
  gradient_accumulation_steps: 1
  bf16: true
  tf32: true
  gradient_checkpointing: false
  attn_implementation: auto
  optim: adamw_torch_fused
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  torch_compile: false

logging:
  log_every_steps: 50
  save_every_steps: 1000
  eval_every_steps: null
  wandb_project: null

artifacts:
  s3_upload: false

distributed:
  backend: nccl
  deepspeed:
    enabled: false
