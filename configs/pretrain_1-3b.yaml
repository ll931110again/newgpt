run_name: pretrain_1-3b

model:
  # ~1.3B GPT-2-style decoder trained from scratch (fits 1x A100 40GB)
  tokenizer_name_or_path: gpt2
  config_name_or_path: configs/model/gpt2_1.3b.json
  init_from: null

data:
  dataset_manifest: data/manifests/v1.json
  format: packed_npy
  seq_len: 2048

train:
  num_train_steps: 5000
  learning_rate: 3.0e-4
  warmup_steps: 50
  weight_decay: 0.1
  lr_scheduler_type: cosine
  grad_clip: 1.0

  # 1.3B @ seq 2048 on A100 40GB: micro-batch 12 fills ~38–40GB VRAM.
  per_device_train_batch_size: 12
  gradient_accumulation_steps: 1
  bf16: true
  tf32: true
  gradient_checkpointing: false
  attn_implementation: auto
  optim: adamw_torch_fused
  dataloader_num_workers: 2
  dataloader_pin_memory: true
  dataloader_prefetch_factor: 2
  torch_compile: false

logging:
  log_every_steps: 50
  save_every_steps: 500
  eval_every_steps: null
  # Enabled when WANDB_API_KEY is set in .env (see docs/22_monitoring.md)
  wandb_project: pretrainer
  wandb_entity: null
  # Enabled when MLOP_API_KEY is set in .env (see docs/22_monitoring.md)
  mlop_project: pretrainer

artifacts:
  # Upload checkpoints + final model to S3 when S3_BUCKET + AWS keys are set
  s3_upload: true

distributed:
  backend: nccl
  # DeepSpeed ZeRO needs Dockerfile.deepspeed (CUDA devel). Single-GPU A100 works without it.
  deepspeed:
    enabled: false

