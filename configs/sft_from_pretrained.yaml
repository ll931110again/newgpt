run_name: sft_from_pretrained

base_model:
  # Point this at the output of pretraining (either local path or an S3-synced path).
  # Examples:
  # - runs/pretrain_gpt2xl_continue/final
  # - checkpoints/pretrain_1-3b/final
  model_name_or_path: checkpoints/pretrain_1-3b/final
  tokenizer_name_or_path: gpt2

data:
  # Expected format: jsonl with {messages:[{role,content}...]} or {prompt,response}
  train_path: data/sft/train.jsonl
  eval_path: data/sft/eval.jsonl
  # Keep SFT context <= the base model context length.
  seq_len: 1024

train:
  num_train_epochs: 1
  learning_rate: 2.0e-5
  weight_decay: 0.0
  per_device_train_batch_size: 1
  gradient_accumulation_steps: 8
  bf16: true
  gradient_checkpointing: true

peft:
  enabled: true
  lora_r: 16
  lora_alpha: 32
  lora_dropout: 0.05

logging:
  log_every_steps: 10
  save_every_steps: 250
  wandb_project: pretrainer
  mlop_project: pretrainer

